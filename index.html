<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Vault - 50+ Creative Image Prompts</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🎨 AI Image Prompt Vault</h1>
        <p>Explore 50 curated image generation prompts for Midjourney, DALL-E 3, & Stable Diffusion</p>
    </header>

    <div class="controls">
        <div class="search-bar-wrap">
            <input type="text" id="searchInput" class="search-bar" placeholder="Search prompts by keyword (e.g., neon, forest, portrait, futuristic)...">
        </div>

        <div class="filters" id="categoryFilters">
            <button class="filter-btn active" data-category="All">All (50)</button>
            <button class="filter-btn" data-category="Portraits">Portraits</button>
            <button class="filter-btn" data-category="Cyberpunk">Cyberpunk & Sci-Fi</button>
            <button class="filter-btn" data-category="Fantasy">Fantasy & Myth</button>
            <button class="filter-btn" data-category="Anime">Anime & Art</button>
            <button class="filter-btn" data-category="Surreal">Surreal & 3D</button>
        </div>
    </div>

    <div class="prompts-grid" id="promptsGrid"></div>
</div>

<div class="toast" id="toast">Copied to Clipboard! 🚀</div>

<script src="script.js"></script>
</body>
</html>
