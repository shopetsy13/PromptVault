<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Privacy: this policy stops the browser from making ANY network request -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Emoji Mosaic</title>
<style>
:root{--bg:#fbf7f2;--ink:#2a2320;--muted:#7a6d65;--line:#e4d9cf;--card:#fff;--accent:#e8590c;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a18;--ink:#f3ece6;--muted:#a89b92;--line:#3a332f;--card:#262220;--accent:#ff8a3d;--accent-ink:#1d1a18}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding:16px;max-width:760px;margin:0 auto}
h1{font-size:1.6rem;margin:8px 0 0}
.sub{color:var(--muted);margin:4px 0 16px}
.privacy{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem;color:var(--muted);margin-bottom:16px;background:var(--card)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.95rem;margin-top:14px;font-weight:600}
label:first-child{margin-top:0}
select,input[type=range]{width:100%;font:inherit;color:var(--ink)}
select{padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
input[type=file]{width:100%;font:inherit;color:var(--ink)}
button{font:inherit;width:100%;padding:13px;margin-top:14px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#out{display:none;width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#000}
#status{color:var(--muted);font-size:.9rem;min-height:1.6em;margin-bottom:8px}
.val{color:var(--accent);font-weight:700}
.hint{font-size:.8rem;color:var(--muted);margin-top:2px}
#thumbBox{display:none;margin-top:10px;align-items:center;gap:12px}
#thumb{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
#thumbName{font-size:.85rem;color:var(--muted);word-break:break-all}
</style>
</head>
<body>
<h1>Emoji Mosaic</h1>
<p class="sub">Choose a photo and it turns into a picture made of tiny emoji.</p>
<div class="privacy">Your photo never leaves your phone. No upload, no login, no account. The browser is also blocked from sending any data to the internet.</div>

<div class="panel">
  <label for="file">1. Choose a photo</label>
  <input id="file" type="file" accept="image/*">
  <div id="thumbBox">
    <img id="thumb" alt="Preview of the chosen photo">
    <div id="thumbName"></div>
  </div>

  <label for="set">2. Emoji type</label>
  <select id="set">
    <option value="single" selected>Single emoji (tinted to match)</option>
    <option value="all">All mixed</option>
    <option value="faces">Faces 😀</option>
    <option value="hearts">Hearts and circles ❤️</option>
    <option value="animals">Animals 🐶</option>
    <option value="food">Food and drink 🍎</option>
    <option value="nature">Nature and weather 🌸</option>
  </select>

  <div id="singleBox">
    <label for="single">Pick the emoji</label>
    <select id="single">
      <option>🙂</option><option>😀</option><option>😂</option><option>❤️</option><option>⭐</option>
      <option>🔵</option><option>☝️</option><option>👍</option><option>🌸</option><option>🐶</option>
    </select>
  </div>

  <div id="styleBox" style="display:none">
    <label for="style">Color style</label>
    <select id="style">
      <option value="real" selected>Auto: realistic (looks like the photo)</option>
      <option value="natural">Natural emoji colors</option>
    </select>
  </div>

  <label for="cols">3. Number of emoji: <span class="val" id="colsV">10000</span></label>
  <input id="cols" type="range" min="500" max="10000" step="500" value="10000">
  <div class="hint">More emoji = more detail, but slower on weak phones.</div>

  <label for="bg">4. Background</label>
  <select id="bg">
    <option value="auto" selected>Auto (colors from your photo)</option>
    <option value="#000000">Black</option>
    <option value="#ffffff">White</option>
  </select>

  <button id="go" disabled>Create mosaic</button>
</div>

<div id="status" role="status" aria-live="polite"></div>
<canvas id="out"></canvas>
<button id="dl" class="alt" style="display:none">Download PNG</button>

<script>
(function(){
"use strict";
var SETS={
faces:"😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😋 😛 😜 🤪 😎 🤓 🥳 😏 😒 😞 😔 😟 😕 🙁 😣 😖 😫 😩 🥺 😢 😭 😤 😠 😡 🤬 🤯 😳 🥵 🥶 😱 😨 😰 😥 😓 🤗 🤔 🤭 🤫 🤥 😶 😐 😑 😬 🙄 😯 😦 😧 😮 😲 🥱 😴 🤤 😪 😵 🤐 🥴 🤢 🤮 🤧 😷 🤒 🤕 🤑 🤠 😈 👿 👹 👺 🤡 💩 👻 💀 👽 🤖 🎃 😺 😸 😹 😻 😼 😽 🙀 😿 😾".split(" "),
hearts:"❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 💕 💞 💓 💗 💖 💘 💝 🔴 🟠 🟡 🟢 🔵 🟣 🟤 ⚫ ⚪ ⭐ 🌟 ✨ 🔥 💧 ☀️ 🌙".split(" "),
animals:"🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐦 🐤 🦆 🦅 🦉 🦇 🐺 🐗 🐴 🦄 🐝 🐛 🦋 🐌 🐞 🐜 🐢 🐍 🦎 🐙 🦑 🦐 🦀 🐡 🐠 🐟 🐬 🐳 🐋 🦈 🐊 🐅 🐆 🦓 🦍 🐘 🦛 🦏 🐪 🦒 🦘 🐃 🐂 🐄 🐎 🐖 🐏 🐑 🐐 🦌 🐕 🐈 🐓 🦃 🦚 🦜 🦢 🐇 🦔".split(" "),
food:"🍎 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🍈 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🍆 🥑 🥦 🥬 🥒 🌶️ 🌽 🥕 🧄 🧅 🥔 🍠 🥐 🍞 🥖 🧀 🥚 🍳 🥞 🥓 🥩 🍗 🍖 🌭 🍔 🍟 🍕 🥪 🌮 🌯 🥗 🍝 🍜 🍲 🍛 🍣 🍱 🍤 🍙 🍚 🍘 🍥 🍡 🍧 🍨 🍦 🥧 🧁 🍰 🎂 🍮 🍭 🍬 🍫 🍿 🍩 🍪 🌰 🥜 🍯 🥛 ☕ 🍵".split(" "),
nature:"🌸 💮 🌹 🥀 🌺 🌻 🌼 🌷 🌱 🌲 🌳 🌴 🌵 🌾 🌿 ☘️ 🍀 🍁 🍂 🍃 🍄 🌍 🌎 🌏 🌕 🌖 🌗 🌘 🌑 🌒 🌓 🌔 🌙 ⭐ 🌟 ☀️ ⛅ ☁️ 🌧️ ⛈️ 🌩️ ❄️ ☃️ 🌈 🌊 🔥 💧 ⚡".split(" ")
};
SETS.all=[].concat(SETS.faces,SETS.hearts,SETS.animals,SETS.food,SETS.nature);

var $=function(id){return document.getElementById(id)};
var fileIn=$("file"),setSel=$("set"),singleSel=$("single"),singleBox=$("singleBox"),styleBox=$("styleBox"),styleSel=$("style"),
    colsIn=$("cols"),colsV=$("colsV"),bgSel=$("bg"),go=$("go"),dl=$("dl"),out=$("out"),status=$("status"),
    thumbBox=$("thumbBox"),thumb=$("thumb"),thumbName=$("thumbName");
var img=null,imgURL=null;
var FONT='"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji","Twemoji Mozilla",sans-serif';
var TINT=0.7;      // how strongly each emoji is colored to match the photo
var AUTO_DIM=0.5;  // brightness of the auto background behind each emoji

function drawEmoji(ctx,ch,S){
  ctx.clearRect(0,0,S,S);
  ctx.font=Math.floor(S*0.78)+"px "+FONT;
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(ch,S/2,S/2+S*0.05);
}
function makeTile(ch,S){
  var c=document.createElement("canvas");c.width=c.height=S;
  drawEmoji(c.getContext("2d"),ch,S);return c;
}
// Average color of an emoji blended over a fixed background color
function avgOver(tile,bg){
  var S=16,c=document.createElement("canvas");c.width=c.height=S;
  var x=c.getContext("2d",{willReadFrequently:true});
  x.fillStyle=bg;x.fillRect(0,0,S,S);x.drawImage(tile,0,0,S,S);
  var d=x.getImageData(0,0,S,S).data,r=0,g=0,b=0,n=S*S;
  for(var i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];}
  return [r/n,g/n,b/n];
}
// Average color of only the visible (opaque) pixels of an emoji
function avgOpaque(tile){
  var S=16,c=document.createElement("canvas");c.width=c.height=S;
  var x=c.getContext("2d",{willReadFrequently:true});
  x.drawImage(tile,0,0,S,S);
  var d=x.getImageData(0,0,S,S).data,r=0,g=0,b=0,a=0;
  for(var i=0;i<d.length;i+=4){var w=d[i+3];r+=d[i]*w;g+=d[i+1]*w;b+=d[i+2]*w;a+=w;}
  return a?[r/a,g/a,b/a]:[0,0,0];
}
// Skip emoji this phone cannot draw (blank or broken)
function hasGlyph(tile){
  var x=tile.getContext("2d",{willReadFrequently:true});
  var d=x.getImageData(0,0,tile.width,tile.height).data,n=0;
  for(var i=3;i<d.length;i+=4){if(d[i]>40)n++;}
  return n>tile.width*tile.height*0.08;
}

function syncUI(){
  var single=setSel.value==="single";
  singleBox.style.display=single?"block":"none";
  styleBox.style.display=single?"none":"block";
}
syncUI();

fileIn.addEventListener("change",function(){
  var f=fileIn.files&&fileIn.files[0];
  if(!f)return;
  if(imgURL)URL.revokeObjectURL(imgURL);
  imgURL=URL.createObjectURL(f);
  thumb.src=imgURL;thumbName.textContent=f.name;thumbBox.style.display="flex";
  var im=new Image();
  im.onload=function(){img=im;go.disabled=false;status.textContent="Photo ready. Tap \u201CCreate mosaic\u201D.";};
  im.onerror=function(){img=null;go.disabled=true;thumbBox.style.display="none";status.textContent="This file could not be opened as an image. Please choose another photo.";};
  im.src=imgURL;
});
setSel.addEventListener("change",syncUI);
colsIn.addEventListener("input",function(){colsV.textContent=colsIn.value;});

go.addEventListener("click",function(){
  if(!img)return;
  go.disabled=true;dl.style.display="none";
  status.textContent="Creating, please wait\u2026";
  setTimeout(function(){
    try{build();}catch(e){status.textContent="Something went wrong. Try a lower number of emoji.";}
    go.disabled=false;
  },30);
});

function build(){
  var total=parseInt(colsIn.value,10),bgv=bgSel.value,auto=(bgv==="auto"),bg=auto?"#000000":bgv;
  var cols=Math.max(1,Math.round(Math.sqrt(total*img.naturalWidth/img.naturalHeight)));
  var rows=Math.max(1,Math.round(total/cols));
  var CELL=Math.max(16,Math.min(48,Math.floor(4000/Math.max(cols,rows))));

  // Shrink the photo so each pixel = one emoji cell
  var sc=document.createElement("canvas");sc.width=cols;sc.height=rows;
  var sx=sc.getContext("2d",{willReadFrequently:true});
  sx.fillStyle="#000";sx.fillRect(0,0,cols,rows);
  sx.imageSmoothingQuality="high";
  sx.drawImage(img,0,0,cols,rows);
  var px=sx.getImageData(0,0,cols,rows).data;

  out.width=cols*CELL;out.height=rows*CELL;
  var ox=out.getContext("2d");
  ox.fillStyle=bg;ox.fillRect(0,0,out.width,out.height);

  var single=(setSel.value==="single");
  var tint=single||styleSel.value==="real";
  var tiles=[],pal=[];
  if(single){
    tiles=[makeTile(singleSel.value,CELL)];
  }else{
    var list=SETS[setSel.value];
    for(var k=0;k<list.length;k++){
      var t=makeTile(list[k],CELL);
      if(!hasGlyph(t))continue;
      tiles.push(t);
      pal.push((auto||tint)?avgOpaque(t):avgOver(t,bg));
    }
    if(!tiles.length){status.textContent="This phone could not draw these emoji.";return;}
  }

  var tmp=document.createElement("canvas");tmp.width=tmp.height=CELL;
  var tx=tmp.getContext("2d");

  for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
    var i=(y*cols+x)*4,r=px[i],g=px[i+1],b=px[i+2],px0=x*CELL,py0=y*CELL;
    if(auto){
      ox.fillStyle="rgb("+((r*AUTO_DIM)|0)+","+((g*AUTO_DIM)|0)+","+((b*AUTO_DIM)|0)+")";
      ox.fillRect(px0,py0,CELL,CELL);
    }
    var best=0;
    if(tiles.length>1){
      var bd=1e12;
      for(var m=0;m<pal.length;m++){
        var c=pal[m],dr=c[0]-r,dg=c[1]-g,db=c[2]-b,d=dr*dr*0.3+dg*dg*0.59+db*db*0.11;
        if(d<bd){bd=d;best=m;}
      }
    }
    if(tint){
      tx.globalCompositeOperation="source-over";
      tx.clearRect(0,0,CELL,CELL);tx.drawImage(tiles[best],0,0);
      tx.globalCompositeOperation="source-atop";
      tx.globalAlpha=TINT;
      tx.fillStyle="rgb("+r+","+g+","+b+")";
      tx.fillRect(0,0,CELL,CELL);tx.globalAlpha=1;
      ox.drawImage(tmp,px0,py0);
    }else{
      ox.drawImage(tiles[best],px0,py0);
    }
  }
  out.style.display="block";dl.style.display="block";
  status.textContent="Done! "+(cols*rows)+" emoji used. Image size: "+out.width+" \u00D7 "+out.height+" px.";
}

dl.addEventListener("click",function(){
  out.toBlob(function(blob){
    if(!blob){status.textContent="Could not create the download. Try a lower number of emoji.";return;}
    var u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download="emoji-mosaic.png";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);
  },"image/png");
});
})();
</script>
</body>
</html>
