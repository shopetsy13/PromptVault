<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- پرائیویسی: براؤزر کو کسی بھی نیٹ ورک درخواست سے روک دیتا ہے -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>ایموجی موزیک</title>
<style>
:root{--bg:#fbf7f2;--ink:#2a2320;--muted:#7a6d65;--line:#e4d9cf;--card:#fff;--accent:#e8590c;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a18;--ink:#f3ece6;--muted:#a89b92;--line:#3a332f;--card:#262220;--accent:#ff8a3d;--accent-ink:#1d1a18}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic","Jameel Noori Nastaleeq",system-ui,sans-serif;line-height:2;padding:16px;max-width:760px;margin:0 auto}
h1{font-size:1.6rem;margin:8px 0 0;line-height:1.8}
.sub{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.privacy{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.88rem;color:var(--muted);margin-bottom:16px;background:var(--card)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.95rem;margin-top:8px}
select,input[type=range]{width:100%;font:inherit;color:var(--ink)}
select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
input[type=file]{width:100%;font:inherit;color:var(--ink)}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font:inherit;width:100%;padding:12px;margin-top:12px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#out{display:none;width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#000}
#status{color:var(--muted);font-size:.9rem;min-height:1.8em}
.val{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<h1>ایموجی موزیک</h1>
<p class="sub">اپنی تصویر چنیں، اور وہ چھوٹے ایموجی سے بن جائے گی۔</p>
<div class="privacy">آپ کی تصویر صرف آپ کے فون میں رہتی ہے۔ نہ اپ لوڈ ہوتی ہے، نہ لاگ ان ہے، اور براؤزر کو انٹرنیٹ سے کوئی ڈیٹا بھیجنے کی اجازت ہی نہیں۔</div>

<div class="panel">
  <label for="file">1. تصویر چنیں</label>
  <input id="file" type="file" accept="image/*">

  <label for="set">2. ایموجی کی قسم</label>
  <select id="set">
    <option value="all">سب ملا کر</option>
    <option value="faces">چہرے 😀</option>
    <option value="hearts">دل اور رنگین نشان ❤️</option>
    <option value="animals">جانور 🐶</option>
    <option value="food">کھانے پینے کی چیزیں 🍎</option>
    <option value="nature">فطرت اور موسم 🌸</option>
    <option value="single">ایک ہی ایموجی (رنگ بدل کر)</option>
  </select>

  <div id="singleBox" style="display:none">
    <label for="single">ایموجی چنیں</label>
    <select id="single">
      <option>😀</option><option>😂</option><option>❤️</option><option>⭐</option><option>🔵</option>
      <option>🙂</option><option>☝️</option><option>👍</option><option>🌸</option><option>🐶</option>
    </select>
  </div>

  <div class="row">
    <div>
      <label for="cols">3. ایموجی کی تعداد: <span class="val" id="colsV">5000</span></label>
      <input id="cols" type="range" min="500" max="5000" step="100" value="5000">
    </div>
  </div>

  <label for="bg">4. پس منظر</label>
  <select id="bg">
    <option value="#000000">سیاہ</option>
    <option value="#ffffff">سفید</option>
  </select>

  <button id="go" disabled>موزیک بنائیں</button>
</div>

<div id="status" role="status" aria-live="polite"></div>
<canvas id="out"></canvas>
<button id="dl" class="alt" style="display:none">PNG ڈاؤن لوڈ کریں</button>

<script>
(function(){
"use strict";
var SETS={
faces:"😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😋 😛 😜 🤪 😎 🤓 🥳 😏 😒 😞 😔 😟 😕 🙁 😣 😖 😫 😩 🥺 😢 😭 😤 😠 😡 🤬 🤯 😳 🥵 🥶 😱 😨 😰 😥 😓 🤗 🤔 🤭 🤫 🤥 😶 😐 😑 😬 🙄 😯 😦 😧 😮 😲 🥱 😴 🤤 😪 😵 🤐 🥴 🤢 🤮 🤧 😷 🤒 🤕 🤑 🤠 😈 👿 👹 👺 🤡 💩 👻 💀 👽 🤖 🎃 😺 😸 😹 😻 😼 😽 🙀 😿 😾".split(" "),
hearts:"❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 💕 💞 💓 💗 💖 💘 💝 🔴 🟠 🟡 🟢 🔵 🟣 🟤 ⚫ ⚪ 🟥 🟧 🟨 🟩 🟦 🟪 🟫 ⬛ ⬜ ⭐ 🌟 ✨ 🔥 💧 ☀️ 🌙".split(" "),
animals:"🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐦 🐤 🦆 🦅 🦉 🦇 🐺 🐗 🐴 🦄 🐝 🐛 🦋 🐌 🐞 🐜 🐢 🐍 🦎 🐙 🦑 🦐 🦀 🐡 🐠 🐟 🐬 🐳 🐋 🦈 🐊 🐅 🐆 🦓 🦍 🐘 🦛 🦏 🐪 🦒 🦘 🐃 🐂 🐄 🐎 🐖 🐏 🐑 🐐 🦌 🐕 🐈 🐓 🦃 🦚 🦜 🦢 🐇 🦔".split(" "),
food:"🍎 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🍈 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🍆 🥑 🥦 🥬 🥒 🌶️ 🌽 🥕 🧄 🧅 🥔 🍠 🥐 🍞 🥖 🧀 🥚 🍳 🥞 🥓 🥩 🍗 🍖 🌭 🍔 🍟 🍕 🥪 🌮 🌯 🥗 🍝 🍜 🍲 🍛 🍣 🍱 🍤 🍙 🍚 🍘 🍥 🍡 🍧 🍨 🍦 🥧 🧁 🍰 🎂 🍮 🍭 🍬 🍫 🍿 🍩 🍪 🌰 🥜 🍯 🥛 ☕ 🍵".split(" "),
nature:"🌸 💮 🌹 🥀 🌺 🌻 🌼 🌷 🌱 🌲 🌳 🌴 🌵 🌾 🌿 ☘️ 🍀 🍁 🍂 🍃 🍄 🌍 🌎 🌏 🌕 🌖 🌗 🌘 🌑 🌒 🌓 🌔 🌙 ⭐ 🌟 ☀️ ⛅ ☁️ 🌧️ ⛈️ 🌩️ ❄️ ☃️ 🌈 🌊 🔥 💧 ⚡".split(" ")
};
SETS.all=[].concat(SETS.faces,SETS.hearts,SETS.animals,SETS.food,SETS.nature);

var $=function(id){return document.getElementById(id)};
var fileIn=$("file"),setSel=$("set"),singleSel=$("single"),singleBox=$("singleBox"),colsIn=$("cols"),colsV=$("colsV"),bgSel=$("bg"),go=$("go"),dl=$("dl"),out=$("out"),status=$("status");
var img=null,imgURL=null;
var FONT='"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji","Twemoji Mozilla",sans-serif';

function drawEmoji(ctx,ch,S){
  ctx.clearRect(0,0,S,S);
  ctx.font=Math.floor(S*0.78)+"px "+FONT;
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(ch,S/2,S/2+S*0.05);
}
function makeTile(ch,S){
  var c=document.createElement("canvas");c.width=c.height=S;
  drawEmoji(c.getContext("2d"),ch,S);return c;
}
// ایموجی کا اوسط رنگ (پس منظر پر ملا کر)
function avgColor(tile,bg){
  var S=16,c=document.createElement("canvas");c.width=c.height=S;
  var x=c.getContext("2d",{willReadFrequently:true});
  x.fillStyle=bg;x.fillRect(0,0,S,S);x.drawImage(tile,0,0,S,S);
  var d=x.getImageData(0,0,S,S).data,r=0,g=0,b=0,n=S*S;
  for(var i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];}
  return [r/n,g/n,b/n];
}
function hasGlyph(tile){ // خالی/ٹوٹے ہوئے ایموجی چھانٹنے کے لیے
  var x=tile.getContext("2d",{willReadFrequently:true});
  var d=x.getImageData(0,0,tile.width,tile.height).data,n=0;
  for(var i=3;i<d.length;i+=4){if(d[i]>40)n++;}
  return n>tile.width*tile.height*0.08;
}

fileIn.addEventListener("change",function(){
  var f=fileIn.files&&fileIn.files[0];
  if(!f)return;
  if(imgURL)URL.revokeObjectURL(imgURL);
  imgURL=URL.createObjectURL(f);
  var im=new Image();
  im.onload=function(){img=im;go.disabled=false;status.textContent="تصویر تیار ہے۔ اب «موزیک بنائیں» دبائیں۔";};
  im.onerror=function(){img=null;go.disabled=true;status.textContent="یہ فائل تصویر کے طور پر نہیں کھل سکی۔ کوئی اور تصویر چنیں۔";};
  im.src=imgURL;
});
setSel.addEventListener("change",function(){singleBox.style.display=setSel.value==="single"?"block":"none";});
colsIn.addEventListener("input",function(){colsV.textContent=colsIn.value;});

go.addEventListener("click",function(){
  if(!img)return;
  go.disabled=true;dl.style.display="none";
  status.textContent="بن رہا ہے، تھوڑا انتظار کریں…";
  setTimeout(function(){
    try{build();}catch(e){status.textContent="کچھ مسئلہ ہوا۔ کم ایموجی تعداد کے ساتھ دوبارہ کوشش کریں۔";}
    go.disabled=false;
  },30);
});

function build(){
  var total=parseInt(colsIn.value,10),bg=bgSel.value;
  var cols=Math.max(1,Math.round(Math.sqrt(total*img.naturalWidth/img.naturalHeight)));
  var rows=Math.max(1,Math.round(total/cols));
  var CELL=Math.max(16,Math.min(48,Math.floor(4000/Math.max(cols,rows))));
  // تصویر کو چھوٹا کر کے ہر خانے کا رنگ لیں
  var sc=document.createElement("canvas");sc.width=cols;sc.height=rows;
  var sx=sc.getContext("2d",{willReadFrequently:true});
  sx.fillStyle=bg;sx.fillRect(0,0,cols,rows);
  sx.imageSmoothingQuality="high";
  sx.drawImage(img,0,0,cols,rows);
  var px=sx.getImageData(0,0,cols,rows).data;

  out.width=cols*CELL;out.height=rows*CELL;
  var ox=out.getContext("2d");
  ox.fillStyle=bg;ox.fillRect(0,0,out.width,out.height);

  var single=setSel.value==="single";
  if(single){
    var base=makeTile(singleSel.value,CELL);
    var tmp=document.createElement("canvas");tmp.width=tmp.height=CELL;
    var tx=tmp.getContext("2d");
    for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
      var i=(y*cols+x)*4;
      tx.globalCompositeOperation="source-over";
      tx.clearRect(0,0,CELL,CELL);tx.drawImage(base,0,0);
      tx.globalCompositeOperation="source-atop";
      tx.globalAlpha=0.72;
      tx.fillStyle="rgb("+px[i]+","+px[i+1]+","+px[i+2]+")";
      tx.fillRect(0,0,CELL,CELL);tx.globalAlpha=1;
      ox.drawImage(tmp,x*CELL,y*CELL);
    }
  }else{
    var list=SETS[setSel.value],tiles=[],cols2=[];
    for(var k=0;k<list.length;k++){
      var t=makeTile(list[k],CELL);
      if(!hasGlyph(t))continue;
      tiles.push(t);cols2.push(avgColor(t,bg));
    }
    if(!tiles.length){status.textContent="اس فون پر ایموجی نہیں بن سکے۔";return;}
    for(var y2=0;y2<rows;y2++)for(var x2=0;x2<cols;x2++){
      var j=(y2*cols+x2)*4,r=px[j],g=px[j+1],b=px[j+2],best=0,bd=1e12;
      for(var m=0;m<cols2.length;m++){
        var c=cols2[m],dr=c[0]-r,dg=c[1]-g,db=c[2]-b,d=dr*dr*0.3+dg*dg*0.59+db*db*0.11;
        if(d<bd){bd=d;best=m;}
      }
      ox.drawImage(tiles[best],x2*CELL,y2*CELL);
    }
  }
  out.style.display="block";dl.style.display="block";
  status.textContent="تیار! "+(cols*rows)+" ایموجی استعمال ہوئے۔ سائز: "+out.width+"×"+out.height+" پکسل۔";
}

dl.addEventListener("click",function(){
  out.toBlob(function(blob){
    if(!blob){status.textContent="ڈاؤن لوڈ فائل نہیں بن سکی۔ کم تعداد کے ساتھ دوبارہ بنائیں۔";return;}
    var u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download="emoji-mosaic.png";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);
  },"image/png");
});
})();
</script>
</body>
</html>
